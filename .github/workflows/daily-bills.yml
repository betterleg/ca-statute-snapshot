name: Daily bills

on:
  schedule:
    # Every day 13:45 UTC; the Legislature writes pubinfo_daily_<Day>.zip around 9:25 p.m. Pacific the night before
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the newest daily file was already read"
        type: boolean
        default: false
      inspect:
        description: "Only print bill table layouts and sample rows (writes nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: statute-snapshot          # never runs at the same time as the weekly statute snapshot (both commit)
  cancel-in-progress: false

jobs:
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read bills
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.inspect }}" = "true" ]; then ARGS="$ARGS --inspect"; fi
          python scripts/pubinfo_bills.py --config config.json --out bills $ARGS

      - name: Commit bills
        if: always() && github.event.inputs.inspect != 'true'
        run: |
          git config user.name "statute-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add bills
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Bills $(date -u +%Y-%m-%d)"
            git push
          fi
